<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SORA</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="instructions">
      <p>Drag letters • Double-click to reset • R to reset</p>
    </div>

    <div id="screen-indicator">
      <span id="screen-type">Desktop</span>
    </div>

    <div id="colorway-menu">
      <div class="colorway-label">Colorways:</div>
      <div class="colorway-buttons" id="colorway-buttons">
        <!-- Colorway buttons will be generated by JavaScript -->
      </div>
    </div>

    <!-- Matter.js -->
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
    <!-- SVGPathSeg polyfill (required) -->
    <script src="https://cdn.jsdelivr.net/npm/pathseg@1.2.1/pathseg.min.js"></script>

    <script src="js/scripts.js"></script>
  </body>
</html>
